name: deploy-cli-ci
on:
  pull_request:
    paths: ["tools/deploy/**", "backend/**", "compose.yaml", ".dockerignore", ".github/workflows/deploy-ci.yml"]
  push:
    branches: ["feature-*"]
    paths: ["tools/deploy/**", "backend/**", "compose.yaml", ".dockerignore", ".github/workflows/deploy-ci.yml"]
jobs:
  v2-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ad6e1418494a6d5724ad41d6ba8cbcebcb0d18d4
          path: v2-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install websockets==13.1
      - run: dotnet build v2-source/backend-v2/Messenger.Api.csproj -c Release --nologo
      - run: python tools/deploy/smoke_v2.py --local-output v2-source/backend-v2/bin/Release/net8.0
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tools/deploy -v
  docker:
    runs-on: ubuntu-latest
    env:
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p messenger-ci up --build -d
      - name: Health, storage and restart
        shell: bash
        run: |
          test "$(docker compose -p messenger-ci exec -T backend cat /app/REVISION)" = "$REVISION"
          python tools/deploy/smoke_current.py --base-url http://127.0.0.1:18090 --restart-container "$(docker compose -p messenger-ci ps -q backend)"
      - if: always()
        run: docker compose -p messenger-ci logs --tail=60 && docker compose -p messenger-ci down -v --rmi local
