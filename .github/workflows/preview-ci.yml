name: preview-cli-ci
on:
  pull_request:
    paths: ["tools/preview/**", ".github/workflows/preview-ci.yml"]
  push:
    branches: ["feature-branch-deployer-design"]
    paths: ["tools/preview/**", ".github/workflows/preview-ci.yml"]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/preview -v
